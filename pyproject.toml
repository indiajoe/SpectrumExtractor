[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15.0",
    # Building against NumPy 2.x produces extensions that are also
    # ABI-compatible with NumPy >= 1.19 at runtime.
    "numpy>=2.0",
]

[project]
name = "SpectrumExtractor"
version = "0.3"
description = "Python Tool for extracting 1D spectrum from 2D image"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
authors = [
    { name = "Joe Ninan", email = "indiajoe@gmail.com" },
]
keywords = ["Spectrum", "Extraction", "Astronomy", "Data", "Reduction"]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "astropy",
    "scikit-image",
    "matplotlib",
    "scipy",
    # NOTE: direct git URLs work for `pip install`, but PyPI will reject
    # an upload that contains one. Remove/relax this if you ever publish.
    "WavelengthCalibrationTool @ git+https://github.com/indiajoe/WavelengthCalibrationTool.git@master",
]

[project.optional-dependencies]
Rectification = ["RVEstimator"]
cosmicray = ["ccdproc"]

[project.urls]
Homepage = "https://github.com/indiajoe/SpectrumExtractor"
Repository = "https://github.com/indiajoe/SpectrumExtractor"

[project.scripts]
spectrum_extractor = "SpectrumExtractor.spectrum_extractor:main"
